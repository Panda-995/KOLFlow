name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source tag or commit to build with this workflow
        required: false
        default: ""

env:
  APP_VERSION: 1.4.3
  GHCR_IMAGE: ghcr.io/panda-995/kolflow
  DOCKERHUB_IMAGE: panda995/kolflow
  HAS_DOCKERHUB: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Verify source version
        run: test "$(node -p "require('./package.json').version")" = "$APP_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native image startup
        run: |
          docker pull ${GHCR_IMAGE}:${APP_VERSION}-${{ matrix.suffix }}
          docker run -d --name kolflow-smoke \
            -e JWT_SECRET=kolflow-release-smoke-isolated-secret \
            -e INVITE_CODE=smoke-invite \
            ${GHCR_IMAGE}:${APP_VERSION}-${{ matrix.suffix }}
          trap 'docker logs kolflow-smoke; docker rm -fv kolflow-smoke' EXIT
          docker exec -i kolflow-smoke node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          let ready = false;
          for (let i = 0; i < 30; i++) {
            try { ready = (await fetch('http://127.0.0.1:3000/api/health')).ok; } catch {}
            if (ready) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert(ready, 'Production image did not become healthy');
          const users = await fetch('http://127.0.0.1:3000/api/auth/check-users');
          assert.equal(users.status, 200);
          assert.equal((await users.json()).hasUsers, false);
          for (const path of ['/', '/app-icon.png', '/privacy-policy.html']) {
            assert.equal((await fetch(`http://127.0.0.1:3000${path}`)).status, 200);
          }
          console.log('Native production image startup, database and static resources verified.');
          JS

      - name: Verify old data and custom folder persistence
        run: bash scripts/verify-container-storage.sh "${GHCR_IMAGE}:1.4.2-${{ matrix.suffix }}" "${GHCR_IMAGE}:${APP_VERSION}-${{ matrix.suffix }}"

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker Hub image
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-manifest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:latest \
            -t ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }} \
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-amd64 \
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-arm64

      - name: Verify published image (GHCR)
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }} \
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-amd64 \
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-arm64

      - name: Verify published image (Docker Hub)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}
