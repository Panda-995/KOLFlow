name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_VERSION: 1.4.2
  GHCR_IMAGE: ghcr.io/panda-995/kolflow
  DOCKERHUB_IMAGE: panda995/kolflow
  HAS_DOCKERHUB: ${{ secrets.DOCKER_HUB_USERNAME != '' && secrets.DOCKER_HUB_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ matrix.suffix }}
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker Hub image
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ matrix.suffix }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-manifest:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (GHCR)
        run: |
          docker buildx imagetools create \
            -t ${{ env.GHCR_IMAGE }}:latest \
            -t ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }} \
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-amd64 \
            ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}-arm64

      - name: Verify published image (GHCR)
        run: |
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ env.APP_VERSION }}

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create and push multi-arch manifest (Docker Hub)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKERHUB_IMAGE }}:latest \
            -t ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }} \
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-amd64 \
            ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}-arm64

      - name: Verify published image (Docker Hub)
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:latest
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ env.APP_VERSION }}
