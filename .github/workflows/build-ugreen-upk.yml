name: Build UGOS Pro UPK

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: UGOS Pro package build number
        required: true
        default: "10"
      release_tag:
        description: Optional GitHub Release tag to publish the UPK files to
        required: false
        default: ""

permissions:
  contents: write
  packages: read

env:
  APP_VERSION: 1.4.1
  GHCR_IMAGE: ghcr.io/panda-995/kolflow

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare package directories
        run: |
          mkdir -p \
            ugreen/kolflow-app/rootfs_amd64/images \
            ugreen/kolflow-app/rootfs_arm64/images

      - name: Verify package version metadata
        run: |
          test "$(awk '/^version:/ { print $2 }' ugreen/kolflow-app/project.yaml)" = "${APP_VERSION}"
          grep -Fq "image: ${GHCR_IMAGE}:${APP_VERSION}" \
            ugreen/kolflow-app/rootfs_common/docker-compose.yaml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export amd64 image
        run: |
          docker pull --platform linux/amd64 ${GHCR_IMAGE}:${APP_VERSION}-amd64
          docker tag \
            ${GHCR_IMAGE}:${APP_VERSION}-amd64 \
            ${GHCR_IMAGE}:${APP_VERSION}
          test "$(docker image inspect ${GHCR_IMAGE}:${APP_VERSION} --format '{{.Architecture}}')" = "amd64"
          docker save \
            -o ugreen/kolflow-app/rootfs_amd64/images/kolflow-${APP_VERSION}-amd64.tar \
            ${GHCR_IMAGE}:${APP_VERSION}

      - name: Export arm64 image
        run: |
          docker image rm ${GHCR_IMAGE}:${APP_VERSION}
          docker pull --platform linux/arm64 ${GHCR_IMAGE}:${APP_VERSION}-arm64
          docker tag \
            ${GHCR_IMAGE}:${APP_VERSION}-arm64 \
            ${GHCR_IMAGE}:${APP_VERSION}
          test "$(docker image inspect ${GHCR_IMAGE}:${APP_VERSION} --format '{{.Architecture}}')" = "arm64"
          docker save \
            -o ugreen/kolflow-app/rootfs_arm64/images/kolflow-${APP_VERSION}-arm64.tar \
            ${GHCR_IMAGE}:${APP_VERSION}

      - name: Install official ugcli
        run: |
          curl -fsSL \
            https://osswaf.ugnas.com/pro/ugcli/download/ugcli-v1.1.0.13-linux-amd64 \
            -o /usr/local/bin/ugcli
          chmod +x /usr/local/bin/ugcli
          ugcli --version

      - name: Check and package UPK
        working-directory: ugreen/kolflow-app
        run: |
          ugcli check
          ugcli pack --arch all --build "${{ inputs.build_number }}"

      - name: Generate checksums
        working-directory: ugreen/kolflow-app/build_dir/pkgs/upk
        run: |
          find . -maxdepth 1 -type f -name '*.upk' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-UPK

      - name: Package store artwork and description
        run: python3 scripts/package-store-assets.py

      - name: Upload UPK packages
        uses: actions/upload-artifact@v4
        with:
          name: kolflow-ugos-pro-${{ env.APP_VERSION }}.${{ inputs.build_number }}
          path: |
            ugreen/kolflow-app/build_dir/pkgs/upk/*.upk
            ugreen/kolflow-app/build_dir/pkgs/upk/SHA256SUMS-UPK
            ugreen/kolflow-app/project.yaml
            ugreen/kolflow-app/rootfs_common/docker-compose.yaml
            ugreen/kolflow-app/rootfs_common/icon.png
            ugreen/README.md
            ugreen/STORE_LISTING.md
            release-artifacts/KOLFlow-v${{ env.APP_VERSION }}-ugreen-store-assets.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish UPK packages to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v${APP_VERSION}"
          gh release upload "$RELEASE_TAG" \
            ugreen/kolflow-app/build_dir/pkgs/upk/*.upk \
            ugreen/kolflow-app/build_dir/pkgs/upk/SHA256SUMS-UPK \
            release-artifacts/KOLFlow-v${APP_VERSION}-ugreen-store-assets.zip \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
