spec_version: "2.1"
app_id: com.panda.kolflow
version: 1.4.3
support_arch:
  - amd64
  - arm64
supports:
  - app
  - pc
is_docker_app: true
only_admin: true
port: 3441
open_type: tab
tag_types:
  - utility
depend_fw_version: 1.13.0.0000
depend_docker_version: 1.7.0.0000
license_agreement_link:
  - https://github.com/Panda-995/KOLFlow/blob/main/LICENSE
source_code_link:
  - https://github.com/Panda-995/KOLFlow
privacy_policy_link:
  - https://github.com/Panda-995/KOLFlow/blob/main/public/privacy-policy.html
parameters:
  - key: DATA_PATH
    type: path
    multi: false
    required: false
    changeable: true
    i18n:
      en-US:
        name: Data folder
        description: Choose a folder for the database and business data. Leave blank to use the existing data directory. Stop the app and copy existing data before switching folders, or restore a backup.
      zh-CN:
        name: 数据文件夹
        description: 选择用于保存数据库和业务数据的文件夹；留空沿用原数据目录。更换文件夹前请停用应用并迁移原数据，或导入备份。
  - key: JWT_SECRET
    type: password
    required: true
    changeable: true
    min_length: 32
    max_length: 128
    i18n:
      en-US:
        name: JWT signing secret
        description: Enter a random secret of 32 to 128 characters for signing login tokens. Keep it safe and unchanged after installation.
      zh-CN:
        name: JWT 签名密钥
        description: 请输入 32 至 128 位随机字符，用于签发登录令牌。安装后请妥善保管，不要随意修改。
  - key: INVITE_CODE
    type: password
    required: true
    changeable: true
    min_length: 6
    max_length: 64
    i18n:
      en-US:
        name: Registration invite code
        description: Please define your own 6-64 character invite code. New users must provide this code when registering.
      zh-CN:
        name: 注册邀请码
        description: 请自定义6-64位邀请码，新用户注册 KOLFlow 账号时必须填写此邀请码。
i18n:
  en-US:
    name: KOLFlow
    description: KOLFlow is an independently developed, self-hosted collaboration manager for content creators. Deploy it on a personal server or NAS and access it through desktop and mobile browsers or an Android client connected to your server. Track orders, delivery dates and progress; reuse order templates; manage brand contacts, tasks, calendars, publication links and paid promotion costs. Record bill settlements, exchanged products and asset sales, and review dashboards, statistics, periodic notifications and activity logs. Data import, export and backup restoration help maintain historical records. Licensed under GNU AGPL v3.0. The project is not affiliated with or partnered with the third-party brands mentioned.
    author: 熊猫不是猫QAQ
    official: https://github.com/Panda-995/KOLFlow
    help: https://post.smzdm.com/p/a6zg63m0/
    publisher: 熊猫不是猫QAQ
    publisher_link: https://github.com/Panda-995
  zh-CN:
    name: KOLFlow
    description: KOLFlow 是面向内容创作者和达人的自托管商单管理套件，可部署在个人服务器或 NAS 上，通过电脑浏览器、手机浏览器和 Android 客户端访问。套件支持记录商单信息、合作类型、交付日期与执行状态，使用模板创建重复商单，管理品牌联系人、待办日历、发布链接和付费推广费用；可跟踪账单结算、置换商品及资产出售情况，并通过仪表盘、数据统计和周期通知查看业务进展。支持操作日志、数据导入导出和备份恢复，便于整理合作记录与维护历史数据。Android 客户端需连接用户自行部署的服务。本项目独立开发，采用 GNU AGPL v3.0 开源，与所提及的第三方品牌不存在隶属或合作关系。
    author: 熊猫不是猫QAQ
    official: https://github.com/Panda-995/KOLFlow
    help: https://post.smzdm.com/p/a6zg63m0/
    publisher: 熊猫不是猫QAQ
    publisher_link: https://github.com/Panda-995
